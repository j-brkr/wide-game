<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Map</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    </head>
    <body>
        <h1>Game</h1>
        <div id="map"></div>
        
        <script>
            // Initialize the map and set its view
            const map = L.map('map').setView([-31.9800, 115.8179], 15);

            // Load and display OpenStreetMap tile layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Display the zone
            let zone = L.circle([-31.9800, 115.8179], {
                color: 'red',
                weight: 1,
                fillColor: '#f03',
                fillOpacity: 0.1,
                radius: 500
            }).addTo(map);

            getLocation();

            function getLocation(){
                if(navigator.geolocation){
                    navigator.geolocation.getCurrentPosition(success, error);
                } else {
                    alert("Location not enabled!");
                }
            }

            function success(position){
                console.log("Position: ");
                console.log(position);
                coords = position.coords;
                let player = L.circle([coords.latitude, coords.longitude], {
                    color: 'blue',
                    fillColor: '#99f',
                    fillOpacity: 0.5,
                    radius: coords.accuracy
                }).addTo(map);
            }

            function error(position){
                alert("Location enabled but no location detected")
            }
        </script>
        
    </body>
</html>
